[workspace]
members = [
    "crates/audiowaveform",
    "crates/audiowaveform-cli",
]
exclude = ["bindings/ruby"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/Antti/audiowaveform"
authors = ["Andrii Dmytrenko", "BBC Research and Development"]

[workspace.dependencies]
assert_cmd = "2.2.2"
byteorder = "1.5"
clap = { version = "4.6.7", features = ["derive"] }
hound = "3.5.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
png = "0.18.1"
predicates = "3.1.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
symphonia = { version = "0.6.1", default-features = false, features = ["all-meta", "opt-simd"] }
tempfile = "3.27.0"
thiserror = "2.0.20"
