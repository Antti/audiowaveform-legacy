name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  library-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
          - decode
          - format-aac
          - format-aiff
          - format-caf
          - format-flac
          - format-m4a
          - format-mp4
          - format-mkv
          - format-webm
          - format-mp1
          - format-mp2
          - format-mp3
          - format-ogg
          - format-wav
          - render
          - wav-output
          - all-formats,render,wav-output

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test library features
        run: cargo test -p audiowaveform --no-default-features --features "${{ matrix.features }}"

  cli-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["", "format-mp3,format-m4a", "render", "wav-output"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test CLI features
        run: cargo test -p audiowaveform-cli --no-default-features --features "${{ matrix.features }}"

  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test workspace
        run: cargo test --workspace
      - name: Check examples
        run: cargo check --workspace --examples

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify publishable crates
        run: cargo package --workspace --all-features --locked
      - uses: actions/upload-artifact@v4
        with:
          name: rust-crates
          path: target/package/*.crate
          if-no-files-found: error

  resampling-32-bit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu
      - name: Install 32-bit linker support
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: Exercise large resampling coordinates on 32-bit
        run: >-
          cargo test -p audiowaveform --no-default-features
          --target i686-unknown-linux-gnu --test audit_followup
          resampling_wide_frame_coordinates_is_safe_on_32_bit_targets
